<!DOCTYPE html>
<html>
<head>
    <title>goopz</title>
    <style type="text/css">
        body {
            background-color: slateblue;
            /* display: flex;
            align-items: center;
            justify-content: center; */
            height: 100vh;
        }
        
        canvas {
            image-rendering: pixelated;
            background-color: black;
        }

        .fixed {
            position: fixed;
        }

        .none {
            display: none;
        }

        p {
            margin: 4px 8px;
            color:antiquewhite;
            font-family: monospace;
        }

        label {
            color: antiquewhite;
        }

        .container {
            display: flex;
            flex-direction: row;
        }

        .left {
            flex-basis: 50%;
            display: flex;
            flex-direction: column;
        }

        .right {
            flex-basis: 50%;
        }

        .section {
            background-color: darkslategrey;
            padding: 0.5em;
            margin: 0.5em;
            border-radius: 3px;
        }

        input[type="number"] {
            max-width: 4em;
        }
    </style>
    <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
    <div class="container">
        <div class="left">
            <div class="section">
                <p>light</p>
                <div class="ui-row">
                    <label>x</label><input type="number" id="light-x" value="0">
                    <label>y</label><input type="number" id="light-y" value="0">
                    <label>z</label><input type="number" id="light-z" value="0">
                </div>
            </div>
        </div>
        <div class="right">
            <canvas width="640" height="480" id="main-canvas"></canvas>
            <div class="-fixed-" id="canvas-debug">
                <p></p>
                <p></p>
                <p></p>
                <p></p>
                <p></p>
                <p></p>
                <p></p>
                <p></p>
            </div>
        </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
</body>
</html>
